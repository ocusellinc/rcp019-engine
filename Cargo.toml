[package]
name = "rcp019-engine"
version = "1.1.2"
authors = ["Paul Redmond", "Bryan Burgers <bryan@burgers.io>"]
edition = "2021"
license = "MIT"
description = "Parser and evaluator for RESO RCP-019 Validation Expressions"
readme = "README.md"
homepage = "https://github.com/ocusellinc/rcp019-engine"
repository = "https://github.com/ocusellinc/rcp019-engine"
keywords = ["rcp019", "reso", "validation", "expression", "real-estate"]

[dependencies]
chrono = { version = "0.4.26", default-features = false, features = ["alloc"] }
regex-lite = { version = "0.1.0", optional = true }
serde_json = { version = "1.0.100", default-features = false, features = ["alloc"] }
winnow = { version = "1.0", default-features = false, features = ["alloc", "ascii"] }

[dev-dependencies]
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1.0.171", features = ["derive"] }

[features]
default = ["std"]
std = ["match_function", "chrono/clock", "chrono/serde"]
match_function = ["regex-lite"]

[[test]]
name = "compliance_tests"
harness = false
required-features = ["std"]
